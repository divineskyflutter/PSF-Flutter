name: psf_application
description: "A new Flutter finance project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3

  # Networking & APIs
  dio: ^5.11.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # Device & Files
  image_picker: ^1.2.3
  file_picker: ^10.3.10
  permission_handler: ^12.0.3
  device_info_plus: ^11.3.0
  path_provider: ^2.1.6
  image_cropper: ^12.2.1

  # Re-compresses every picked/cropped photo to a small JPEG before it's
  # uploaded via SaveDocument (see shared/utils/image_picker_util.dart).
  # Needed because image_picker's own `imageQuality` only compresses JPEG
  # output — Android's ImageResizer silently ignores it for PNG output
  # from image_cropper ("compressing is not supported for type PNG"), so
  # an uncompressed PNG crop was reaching SaveDocument at full size and
  # getting rejected by the API's upload limit.
  flutter_image_compress: ^2.5.1

  # UI & Animations
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0

  # Firebase & Notifications
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

  # Utilities
  app_links: ^6.4.1
  envied: ^1.3.8
  intl: ^0.20.3

  # PDF Viewing
  pdfx: ^2.9.2

  lottie: ^3.3.3

  pinput: ^6.0.2

  cached_network_image: ^3.4.1

  photo_view: ^0.15.0

  signature: ^6.4.0

  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.1

  # Application preview: client-generated PDF (matches the printed
  # member/nominee form) + the book-style page-turn effect used to
  # browse it on the Preview screen. Saving the generated PDF reuses
  # file_picker (already above) via its saveFile()/SAF picker, so no
  # extra storage-permission dependency is needed for that part.
  #
  # Pinned to ^3.12.0, not ^3.13.0 — 3.13.0 requires Dart >=3.12.0, and
  # this project's pinned Flutter/Dart toolchain (via fvm) is on Dart
  # 3.11.1, which only 3.12.0 and below support.
  pdf: ^3.12.0
  page_flip: ^0.2.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  envied_generator: ^1.3.8

  # IMPORTANT: Pin this version temporarily
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/animations/lottie/
    - assets/animations/gif/
    - assets/translations/
    - assets/images/onboarding/
    - assets/images/logo/
    - assets/images/rules_doc_images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_24pt-Regular.ttf
          weight: 400

        - asset: assets/fonts/inter/Inter_24pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/inter/Inter_24pt-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/inter/Inter_24pt-Bold.ttf
          weight: 700

        - asset: assets/fonts/inter/Inter_24pt-ExtraBold.ttf
          weight: 800

    # Used only by the PDF generator (lib/shared/utils/registration_pdf_builder.dart)
    # to render Gujarati/Hindi text into the downloaded application PDF —
    # the pdf package draws its own glyphs and has no access to the
    # device's system fonts, unlike on-screen Flutter text (which already
    # renders Gujarati/Hindi fine via the OS's font fallback). Google
    # Noto fonts, SIL Open Font License — free to bundle/redistribute.
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/noto/NotoSansGujarati-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto/NotoSansGujarati-Bold.ttf
          weight: 700

    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/noto/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto/NotoSansDevanagari-Bold.ttf
          weight: 700