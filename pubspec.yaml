name: psf_application
description: "A new Flutter finance project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3

  # Networking & APIs
  dio: ^5.11.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # Device & Files
  image_picker: ^1.2.3
  file_picker: ^10.3.10
  permission_handler: ^12.0.3
  device_info_plus: ^11.3.0
  path_provider: ^2.1.6
  image_cropper: ^12.2.1

  # UI & Animations
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0

  # Firebase & Notifications
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

  # Utilities
  app_links: ^6.4.1
  envied: ^1.3.8
  intl: ^0.20.3

  # PDF Viewing
  pdfx: ^2.9.2

  lottie: ^3.3.3

  pinput: ^6.0.2

  cached_network_image: ^3.4.1

  photo_view: ^0.15.0

  signature: ^6.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  envied_generator: ^1.3.8

  # IMPORTANT: Pin this version temporarily
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    - assets/animations/lottie/
    - assets/animations/gif/
    - assets/translations/
    - assets/images/onboarding/
    - assets/images/logo/
    - assets/images/rules_doc_images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_24pt-Regular.ttf
          weight: 400

        - asset: assets/fonts/inter/Inter_24pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/inter/Inter_24pt-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/inter/Inter_24pt-Bold.ttf
          weight: 700

        - asset: assets/fonts/inter/Inter_24pt-ExtraBold.ttf
          weight: 800